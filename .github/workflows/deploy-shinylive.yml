name: Build and Deploy Shinylive App

on:
  push:
    branches: [main, master]

# Permissions required for secure GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install System Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libuv1-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libarchive-dev \
            libxml2-dev
        # This runs directly in the Ubuntu Linux terminal shell
        
      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # Leverages pre-compiled Linux binary speeds
        
      - name: Install Build Toolchain Dependencies
        run: |
          install.packages(c("fs", "shinylive"), repos = "https://cran.rstudio.com")
        shell: Rscript {0}

      - name: Execute buildWASM Bundling Pipeline
        run: |
          # 1. Create clean workspace staging environments
          if(fs::dir_exists("wasm_build")) fs::dir_delete("wasm_build")
          if(fs::dir_exists("staging_app")) fs::dir_delete("staging_app")
          fs::dir_create("staging_app")

          # 2. Identify application layouts and dynamic source components
          app_files <- c("ui.R", "server.R", "app.R")
          # Filter files to only grab what is present in the workspace
          app_files <- app_files[file.exists(app_files)]
          helper_scripts <- list.files(pattern = "GScholarLENS.*\\.R")

          # Flatten, reverse-strip source connections, and merge into app.R
          cat(unlist(lapply(c(helper_scripts, app_files), function(x){
            return(grep(pattern = "source\\(.*\\)", x = readLines(x), value = TRUE, invert = TRUE))
          })), file="staging_app/app.R", sep="\n")

          # 3. Pull required asset files and global web layout assets
          if(fs::dir_exists("www/")) {
            fs::dir_copy("www/", "staging_app/")
          }
          if(fs::file_exists("2024-JCR_IMPACT_FACTOR.xlsx")) {
            fs::file_copy("2024-JCR_IMPACT_FACTOR.xlsx", "staging_app/")
          }

          # 4. Compile the target bundle out to static WebAssembly chunks
          shinylive::export(
            appdir = "./staging_app/", 
            destdir = "./wasm_build/", 
            wasm_packages = TRUE, 
            quiet = FALSE
          )
        shell: Rscript {0}

      # --- NEW STEP: FETCH AND INJECT LATEST WEBR OVERRIDE ---
      - name: Update webR to Latest GitHub Release
        env:
          # GitHub Actions provides this token automatically. We use it 
          # so the 'gh' CLI doesn't hit unauthenticated rate limits.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          echo "Fetching the latest webR release from GitHub..."
          TMP_DIR=$(mktemp -d)
          cd $TMP_DIR
          
          # Download the latest tarball via GitHub CLI
          gh release download -R r-wasm/webr --pattern "webr-*.tar.gz" --clobber
          
          echo "Extracting webR archive..."
          ARCHIVE_FILE=$(ls webr-*.tar.gz)
          tar -xzf "$ARCHIVE_FILE"
          
          # Locate the extracted contents
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "webr*" ! -name "." | head -n 1)
          
          echo "Injecting latest webR into Shinylive build..."
          # We use $GITHUB_WORKSPACE to ensure we are pointing at the correct absolute path
          if [ -n "$EXTRACTED_DIR" ]; then
              rsync -av "$EXTRACTED_DIR/" "$GITHUB_WORKSPACE/wasm_build/shinylive/webr/"
          else
              rsync -av --exclude="*.tar.gz" ./ "$GITHUB_WORKSPACE/wasm_build/shinylive/webr/"
          fi
          
          echo "Cleaning up temporary files..."
          cd "$GITHUB_WORKSPACE"
          rm -rf "$TMP_DIR"

      - name: Upload Static Web Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'wasm_build' # Configured to target your script's output destination
          retention-days: 1

      - name: Deploy Directly to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4